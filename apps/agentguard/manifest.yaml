package_format_version: 1
id: io.timeplus.agentguard
name: AgentGuard
version: 0.8.1
author: Timeplus
icon: "data:image/svg+xml;base64,"
description: >
  AgentGuard core telemetry pipeline for AI coding agents (Claude Code, Codex,
  OpenClaw, Hermes, OpenInference/OTLP), with Agent Rooms 3D, a live 3D view of agent
  sessions. Ingests OTLP traces/logs/metrics and agent hook
  events, normalizes them into a Common Information Model (agentguard_cim_event),
  computes per-call token/cost/latency metrics, and ships four Core Protection
  detection rules (prompt injection, DLP, privilege escalation, supply chain)
  that run from install. Six dashboards cover the overview, sessions and
  activity, token usage, tool calls, a per-session trace and threats.
  Agent Rooms 3D is an optional custom UI, shown on
  Timeplus app server 3.5.2 or later; older versions install the app without
  it. Pause a rule with:
    SYSTEM PAUSE MATERIALIZED VIEW <db>.mv_rule_rp001;
db_name: ag
categories:
  - security
  - observability

config:
  - key: otel_port
    type: integer
    required: false
    default: "4318"
    description: TCP port for the OTLP/HTTP input (agentguard_otel_input). Choose a free port on the Timeplus host.
  - key: otel_listen_host
    type: string
    required: false
    default: "0.0.0.0"
    description: Bind address for the OTLP/HTTP input.

