dashboards:
  - file: dashboards/main.json
    name: "Agents: Overview"
    description: Active sessions, tool calls, tokens and open threats at a glance, events per minute and the most active sessions.
  - file: dashboards/sessions.json
    name: "Agents: Sessions and Activity"
    description: What the agents are doing. Active sessions over time, activity mix, projects, time waiting on a person and the session list.
  - file: dashboards/tokens.json
    name: "Agents: Token Usage"
    description: Tokens by model and by type, cache hit ratio, model request latency and the sessions using the most tokens.
  - file: dashboards/tools.json
    name: "Agents: Tool Calls"
    description: Which tools are used, slow or failing. Top tools, duration, failed and blocked calls, MCP servers and skills, repeated calls.
  - file: dashboards/session_trace.json
    name: "Agents: Session Trace"
    description: One session step by step. Prompts, model requests, tool calls and replies, turns, context growth and detections.
  - file: dashboards/threats.json
    name: "Agents: Threats"
    description: Security detections. Open threats by severity, detections by rule, tool and session, blocked actions and recent threats.

uis:
